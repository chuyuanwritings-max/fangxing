  ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeStyle = C.ink;
  ctx.fillStyle = C.ink;
  ctx.fillText(s, x + size / 14, y + size / 10);
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color || C.yellow;
  ctx.fillText(s, x, y);
}

// —— 方块：平涂 + 下边一层硬阴影 + 深色描边 ——
function block(ctx, x, y, w, h, fill, shade, opt) {
  opt = opt || {};
  const o = opt.outline === undefined ? 2 : opt.outline;
  if (opt.drop) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x + opt.drop, y + opt.drop, w, h);
  }
  ctx.fillStyle = C.ink;
  ctx.fillRect(x - o, y - o, w + o * 2, h + o * 2);
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  if (shade) {
    const sh = opt.shadeH || Math.max(3, Math.round(h * 0.14));
    ctx.fillStyle = shade;
    ctx.fillRect(x, y + h - sh, w, sh);
  }
  if (opt.hi) {
    ctx.fillStyle = opt.hi;
    ctx.fillRect(x, y, w, 2);
  }
}

// —— 像素格 ——
// tone：'grey' 报纸灰 / 'pale' 褪色（重病）/ 空 = 原色
const toneCache = {};
function toneColor(c, tone) {
  const k = tone + c;
  if (toneCache[k]) return toneCache[k];
  const n = parseInt(c.slice(1), 16);
  const r = (n >> 16) & 255;
  const g = (n >> 8) & 255;
  const b = n & 255;
  const l = 0.3 * r + 0.59 * g + 0.11 * b;
  let out;
  if (tone === 'grey') {
    // 报纸只有四种灰
    const lv = l < 60 ? '#2b2620' : l < 120 ? '#5a534a' : l < 185 ? '#8f877b' : '#d6cdbb';
    out = lv;
  } else {
    const m = (v) => Math.round(v * 0.35 + l * 0.45 + 30);
    out = 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
  }
  toneCache[k] = out;
  return out;
}

function drawCells(ctx, cells, gw, gh, x, y, cell, headDy, headRows, tint, tone) {
  const ov = 0.35; // 盖一点缝，免得放大后格子之间露线
  for (let j = 0; j < gh; j++) {
    const dy = j < headRows ? headDy : 0;
    for (let i = 0; i < gw; i++) {
      const c = cells[j * gw + i];
      if (!c) continue;
      ctx.fillStyle = tone ? toneColor(c, tone) : c;
      ctx.fillRect(x + i * cell, y + j * cell + dy, cell + ov, cell + ov);
    }
  }
  if (tint) {
    // 暗处的人：整体压暗
    ctx.fillStyle = tint;
    for (let j = 0; j < gh; j++) {
      const dy = j < headRows ? headDy : 0;
      for (let i = 0; i < gw; i++) if (cells[j * gw + i]) ctx.fillRect(x + i * cell, y + j * cell + dy, cell + ov, cell + ov);
    }
  }
}

function portrait(ctx, f, x, y, cell, o) {
  o = o || {};
  const g = face.grid(f, o);
  drawCells(ctx, g, face.W, face.H, x, y, cell, o.headDy || 0, face.HEAD_ROWS, o.tint, o.tone);
}

const iconCache = {};
function iconCells(name) {
  if (iconCache[name]) return iconCache[name];
  const ic = ICONS[name];
  const gh = ic.m.length + 2;
  const gw = ic.m.reduce((m, r) => Math.max(m, r.length), 0) + 2;
  const c = new Array(gw * gh).fill(null);
  ic.m.forEach((row, j) => {
    for (let i = 0; i < row.length; i++) if (row[i] !== '.') c[(j + 1) * gw + i + 1] = ic.p[row[i]];
  });
  const out = c.slice();
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    if (c[y * gw + x]) continue;
    const n = (xx, yy) => xx >= 0 && xx < gw && yy >= 0 && yy < gh && c[yy * gw + xx];
    if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) out[y * gw + x] = C.ink;
  }
  iconCache[name] = { c: out, w: gw, h: gh };
  return iconCache[name];
}
// cx, cy 是中心
function icon(ctx, name, cx, cy, cell) {
  if (!ICONS[name]) return;
  const ic = iconCells(name);
  drawCells(ctx, ic.c, ic.w, ic.h, Math.round(cx - (ic.w * cell) / 2), Math.round(cy - (ic.h * cell) / 2), cell, 0, 0);
}

// —— 印章 ——
function polygon(ctx, x, y, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + (Math.PI * 2 * i) / n;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function sealPath(ctx, shape, x, y, r) {
  if (shape === 'circle') {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
  } else if (shape === 'hex') polygon(ctx, x, y, r, 6, Math.PI / 6);
  else polygon(ctx, x, y, r * 1.12, 4, Math.PI / 4);
}
function seal(ctx, s, x, y, r, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 0.88 : alpha;
  const col = SEAL_COLORS[s.color] || s.color;
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(2, r * 0.14);
  sealPath(ctx, s.shape, x, y, r);
  ctx.stroke();
  sealPath(ctx, s.shape, x, y, r * 0.72);
  ctx.lineWidth = Math.max(1, r * 0.06);
  ctx.stroke();
  text(ctx, s.char || '准', x, y + 1, Math.round(r * 0.8), col, 'center', '900');
  ctx.restore();
}

// —— 大章（放行 / 驳回）——
function bigStamp(ctx, x, y, w, h, ok, alpha, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.globalAlpha = alpha;
  const col = ok ? '#2fae5c' : '#d8362d';
  ctx.strokeStyle = col;
  ctx.lineWidth = 4;
  ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.lineWidth = 2;
  ctx.strokeRect(-w / 2 + 5, -h / 2 + 5, w - 10, h - 10);
  text(ctx, ok ? '放 行' : '驳 回', 0, 1, Math.round(h * 0.5), col, 'center', '900');
  ctx.restore();
}

function idCard(ctx, x, y, d, f) {

// 规则层：一局（12 天）、一天、一个人、拉线审问、按手印、判对判错、工资条、家里过夜、报纸、存档。
// 不画画、不碰平台，node 里也能直接跑（test/sim.js）。
const config = require('./config.js');
const data = require('./data.js');
const story = require('./story.js');
const face = require('./face.js');
const { rng, pick, randInt, hash, fmtDate, meets, fill } = require('./util.js');

const DAYS = data.days.length;

// —— 一局 ——
function mem() {
  return { sick: 0, hunger: 0, cold: 0, dead: false, deadDay: 0 };
}
function newRun(seed) {
  return {
    v: 2,
    seed: seed >>> 0,
    dayIdx: 0,
    money: config.startMoney,
    flags: {},
    fam: { nan: mem(), man: mem(), yuan: mem(), dou: null },
    debt: 0,
    tuition: 0,
    errands: 0,
    stats: { total: 0, correct: 0, wrong: 0, evidence: 0, prints: 0, bribes: 0, red: 0, green: 0, grey: 0, fines: 0, warns: 0, missed: {}, days: [], deaths: [], ads: {} },
    faces: {},
    said: {},
    returners: [],
    doctorUsed: {},
    over: null,
  };
}

function dayData(run) {
  return data.days[Math.min(run.dayIdx, DAYS - 1)];
}
function today(run) {
  return dayData(run).date;
}
function rules(run) {
  return dayData(run).rules;
}
function chapter(run) {
  return dayData(run).ch;

  return tool === 'line' || (tool === 'print' && chapter(run) >= 2);

  return pick(r, data.generic.surnames) + pick(r, data.generic.given);

      pass: { name, until: t + randInt(r, 3, 50), seal: Object.assign({}, data.seal), no: 'N-' + randInt(r, 10000, 99999) },
    },
    flaw: null,
    bribe: 0,
    med: false,
    react: null,
    reactLine: '',
    raise: 0,
    memory: null,
    story: null,
    ix: { red: {}, green: {}, reacted: false, printed: false, printMatch: null },

  return chars.join('');

function ruleToFlaw(run, rule, r) {
  if (rule === 'photo' && r() < config.subtle[run.dayIdx].oldPhoto) return 'photoOld';
  return rule;
}

function otherPurpose(r, cur) {

  let n = 0;
  while ((p === cur || !p) && n++ < 20) p = pick(r, data.generic.purposes);
  return p;
}

// 被拉出红线后会怎么反应（路人随机，回头客照剧本）
function assignReact(run, p, r) {
  const f = p.flaw;
  if (!f) return;
  const G = data.generic;
  const kind = f.kind === 'photoOld' ? 'photo' : f.kind;
  if (f.kind === 'photoOld' || (f.kind === 'photo' && chapter(run) >= 2 && r() < 0.6)) {

    p.reactLine = pick(r, G.explainPhoto);

    p.reactLine = pick(r, G.bribe);
    p.raise = p.bribe * 2;
    return;
  }
  const w = config.reactWeights;
  if (r() < w.confess / (w.confess + w.lie)) {
    p.react = 'confess';
    p.reactLine = pick(r, G.confess[kind]);
  } else {
    p.react = 'lie';
    const other = otherPurpose(r, p.purpose);
    p.reactLine = fill(pick(r, G.lie[kind]).replace('{p}', other.p));

}

// 新规则当天多考一点
function pickRule(run, r) {
  const rs = rules(run).slice();
  const nr = dayData(run).newRule;
  if (nr) rs.push(nr, nr);
  return pick(r, rs);
}

function personFace(run, who) {
  if (run.faces[who]) return run.faces[who];
  const pp = story.people[who];
  let parts;
  if (pp && pp.faceOf) parts = data.family[pp.faceOf].face;
  else if (pp) parts = pp.face;
  else parts = data.family[who].face;
  const f = face.withParts(rng(hash(who)), parts);
  run.faces[who] = f;
  return f;
}

function storyPerson(run, s, r) {
  const pp = story.people[s.who] || {};
  const f = personFace(run, s.who);
  const p = basePerson(run, r, pp.docName || pp.name, f);
  p.displayName = pp.name;
  p.line = s.line || (s.lines ? s.lines.join('') : '');
  p.item = s.item || p.item;
  p.story = s;
  if (s.kind === 'talk') {
    p.docs = null;
    return p;
  }
  if (s.until) p.docs.pass.until = today(run) + s.until;
  if (s.flaw) applyFlaw(run, p, s.flaw, r, { gap: s.gap, altName: s.altName, photoMode: s.photoMode, sealOld: s.sealOld });
  p.bribe = s.bribe || 0;
  p.med = !!s.med;
  if (s.flaw) {
    p.react = s.react || 'confess';
    p.reactLine = s.reactLine || '……';
    p.raise = s.raise || (p.bribe ? p.bribe * 2 : 0);
    const prev = run.said[s.who];
    if (s.memory) p.memory = { label: '上次', text: s.memory };
    else if (p.react === 'lie' && prev) p.memory = { label: '上次（第 ' + prev.day + ' 天）说', text: prev.text };
  }
  return p;
}

function returnerPerson(run, rt, r) {
  const p = basePerson(run, r, rt.name, rt.face);
  p.returner = rt;
  const prev = data.generic.purposes.find((x) => x.say === rt.said) || data.generic.purposes[0];
  if (r() < 0.5) {
    p.line = '证办好了。上回是我不对。';
    p.purpose = prev;
  } else {
    // 又来了，换了个说法：和上次说的对不上
    p.purpose = otherPurpose(r, prev);
    p.line = p.purpose.say;
    applyFlaw(run, p, ruleToFlaw(run, pickRule(run, r), r), r);
    if (p.flaw.kind === 'photoOld') {
      p.react = 'explain';
      p.reactLine = pick(r, data.generic.explainPhoto);
    } else {
      const kind = p.flaw.kind;
      p.react = 'lie';
      p.reactLine = fill(pick(r, data.generic.lie[kind]).replace('{p}', otherPurpose(r, p.purpose).p));
    }
    p.memory = { label: '上次（第 ' + (rt.day + 1) + ' 天）说', text: rt.said };
  }
  return p;
}

// —— 一天 ——
function startDay(run) {
  const di = run.dayIdx;
  const dd = data.days[di];
  const r = rng(run.seed * 31 + di * 977 + 5);
  const n = config.peoplePerDay[di];
  const queue = [];
  for (let i = 0; i < n; i++) {
    const fx = dd.fixed && dd.fixed[i];
    queue.push(genericPerson(run, r, r() < config.invalidRate[di], fx));
  }
  // 回来的路人
  const back = run.returners.filter((x) => x.back === di).slice(0, config.returnerMax);
  run.returners = run.returners.filter((x) => x.back > di);
  back.forEach((rt) => queue.splice(randInt(r, 3, queue.length), 0, returnerPerson(run, rt, r)));
  // 回头客按顺序插进去
  story.beats
    .filter((s) => s.day === di + 1 && meets(run.flags, s.need))
    .sort((a, b) => a.at - b.at)
    .forEach((s) => queue.splice(Math.min(s.at, queue.length), 0, storyPerson(run, s, r)));
  return {
    idx: di,
    date: dd.date,
    ch: dd.ch,
    timeLeft: config.daySec[di],
    queue,
    qi: 0,
    r,
    mistakes: 0,
    ledger: { n: 0, correct: 0, wrong: 0, pay: 0, evidence: 0, evN: 0, double: 0, warns: [], fines: [], drawer: 0, events: [] },
    cards: [],
    adsLeft: config.fileAdsPerDay,
    overtimeUsed: false,
    doubleUsed: false,
    appealsLeft: config.appealPerDay,
    gifts: {},
    log: [],
    endShown: 0,
  };
}

function current(day) {
  return day.queue[day.qi] || null;
}

function addOvertime(run, day) {
  day.overtimeUsed = true;
  day.timeLeft = config.overtimeSec;
  for (let i = 0; i < config.overtimeExtraPeople; i++) {
    day.queue.push(genericPerson(run, day.r, day.r() < config.invalidRate[day.idx]));
  }
}

// —— 拉线审问 ——
// a、b 是两处的 id（id.photo / pass.name / chip.expiry / face …）
// 返回 kind：red 对不上 / green 对得上 / grey 不用对 / off 今天不查
function link(run, p, a, b) {
  if (!p || !p.docs || a === b) return { kind: 'none' };
  const key = [a, b].sort().join('|');
  const rule = data.pairs[key];
  if (!rule) return { kind: 'grey' };
  if (rules(run).indexOf(rule) < 0) return { kind: 'off', rule };
  const f = p.flaw;
  let red = false;
  if (f) red = rule === 'photo' ? f.kind === 'photo' || f.kind === 'photoOld' : f.kind === rule;
  const res = { kind: red ? 'red' : 'green', rule };
  if (red) {
    p.ix.red[rule] = true;
    run.stats.red += 1;
    if (!p.ix.reacted) {
      p.ix.reacted = true;
      res.react = p.react || 'confess';
      res.line = p.reactLine || '……';
      res.memory = p.memory;
      if (p.react === 'bribe') {
        res.from = p.bribe;
        p.bribe = p.raise || (p.bribe ? p.bribe * 2 : 20);
        res.to = p.bribe;
        p.bribeRaised = true;
      }
    } else {
      res.react = 'again';
      res.line = '……';
    }
  } else {
    p.ix.green[rule] = true;
    run.stats.green += 1;
  }
  return res;
}

function canPrint(run, p) {
  return hasTool(run, 'print') && p && p.docs && Object.keys(p.ix.red).length > 0 && !p.ix.printed;
}

// 按手印：对上 = 本人
function takePrint(run, p) {
  p.ix.printed = true;
  p.ix.printMatch = p.docs.id.print === p.print;
  run.stats.prints += 1;
  return p.ix.printMatch;
}

function ruleOf(kind) {
  return kind === 'photoOld' ? 'photo' : kind;
}

// 判一个人。decision: 'pass' | 'reject'；took：收没收夹着的钱 / 药
function resolve(run, day, p, decision, took) {
  const f = p.flaw;
  const invalid = !!f && !f.legit;
  const correct = (decision === 'reject') === invalid;
  const red = !!(f && p.ix.red[ruleOf(f.kind)]);
  let evidence = false;
  if (correct && invalid && red) evidence = true;
  if (correct && f && f.legit && p.ix.printed) evidence = true;
  const L = day.ledger;
  L.n += 1;
  const res = { correct, evidence, decision, invalid, reason: explain(run, p), fine: 0, warn: 0, took: !!(took && p.bribe), reward: null };
  if (correct) {
    L.correct += 1;
    L.pay += config.pay.correct;
    if (evidence) {
      L.evidence += config.pay.evidence;
      L.evN += 1;
    }
  } else {
    L.wrong += 1;
    day.mistakes += 1;
    if (day.mistakes > config.pay.freeWarnings) {
      res.fine = config.pay.fine;
      L.fines.push({ amount: config.pay.fine, reason: shortReason(p), appealed: false });
      run.stats.fines += 1;
    } else {
      res.warn = day.mistakes;
      L.warns.push({ reason: shortReason(p) });
      run.stats.warns += 1;
    }
  }
  if (took && p.bribe && !p.med) {
    L.drawer += p.bribe;
    run.stats.bribes += p.bribe;
  }
  const S = run.stats;
  S.total += 1;
  if (correct) S.correct += 1;
  else {
    S.wrong += 1;
    const k = invalid ? f.kind : 'clean';
    S.missed[k] = (S.missed[k] || 0) + 1;
  }
  if (evidence) S.evidence += 1;
  const s = p.story;
  if (s) {
    const id = s.id;
    const F = run.flags;
    F[id + '_seen'] = true;
    F[id + (decision === 'pass' ? '_pass' : '_reject')] = true;
    if (p.bribe) F[id + (took ? '_took' : '_refused')] = true;
    if (red) F[id + '_red'] = true;
    if (p.ix.printed) F[id + '_print'] = true;
    if (s.set) F[s.set] = true;
    if (decision === 'pass' && s.passSet) F[s.passSet] = true;
    if (decision === 'reject' && s.rejectSet) F[s.rejectSet] = true;
    if (s.gift && (s.gift.on === 'any' || s.gift.on === decision)) day.gifts[s.gift.item] = id;
    if (s.reward && s.reward.on === decision && meets(F, s.reward.need)) {
      L.drawer += s.reward.drawer;
      run.stats.bribes += s.reward.drawer;
      res.reward = s.reward;
    }
    run.said[s.who] = { day: day.idx + 1, text: s.line };
  } else if (decision === 'reject' && invalid && !p.returner && day.r() < config.returnerRate && day.idx + 2 < DAYS) {
    // 被驳回的路人，过两三天可能回来
    run.returners.push({ name: p.name, face: p.face, said: p.purpose ? p.purpose.say : '', day: day.idx, back: day.idx + 2 + (day.r() < 0.5 ? 1 : 0) });
  }
  day.log.push({ name: p.name, story: s && s.id, decision, correct, evidence, flaw: f && f.kind, fine: res.fine, warn: res.warn });
  return res;
}

// 说话类来访：选一个
function talkChoice(run, day, p, choiceId) {
  const s = p.story;
  const c = s.choices.find((x) => x.id === choiceId) || s.choices[0];
  const F = run.flags;
  F[s.id + '_seen'] = true;
  F[s.id + '_' + c.id] = true;
  if (c.set) F[c.set] = true;
  if (c.gift) day.gifts[c.gift] = s.id;
  run.said[s.who] = { day: day.idx + 1, text: (s.lines || []).join('') };
  day.log.push({ name: p.displayName || p.name, story: s.id, decision: 'talk:' + c.id });
  return c;
}

function explain(run, p) {
  const e = data.explain;
  if (!p.flaw) return e.clean;
  const f = p.flaw;
  if (f.kind === 'photo' && chapter(run) >= 2) return e.photo2;
  return fill(e[f.kind], f.a, f.b);
}
function shortReason(p) {
  if (!p.flaw) return '赶走了没问题的人';
  return { expiry: '放了过期证', name: '放了错名字', photo: '放了冒名的', photoOld: '赶走了本人', seal: '放了假章' }[p.flaw.kind] || '判错';
}

// —— 下班 ——
function closeDay(run, day) {
  story.events.filter((e) => e.day === day.idx + 1 && meets(run.flags, e.need)).forEach((e) => {
    if (day.ledger.events.some((x) => x.src === e)) return;
    day.ledger.events.push({ src: e, title: e.title, money: e.money, who: e.who });
    if (e.card) day.cards.push(e);
    if (e.set) run.flags[e.set] = true;
  });
}

function finesTotal(day) {
  return day.ledger.fines.reduce((s, f) => s + (f.appealed ? 0 : f.amount), 0);
}

function income(day) {
  const L = day.ledger;
  return L.pay + L.evidence + L.double - finesTotal(day) + L.drawer + L.events.reduce((s, e) => s + e.money, 0);
}

function applyDouble(day) {
  day.doubleUsed = true;
  day.ledger.double = Math.min(config.doubleCap, day.ledger.pay);
}

function appealOne(day) {
  if (day.appealsLeft <= 0) return false;
  const f = day.ledger.fines.find((x) => !x.appealed);
  if (!f) return false;
  f.appealed = true;
  day.appealsLeft -= 1;
  return true;
}

// 工资条：一行一行（main 里打印机一行行吐）
function payslip(run, day) {
  const L = day.ledger;
  const out = [];
  out.push({ k: 'n', label: '查验 ' + L.n + ' 人', amount: null });
  out.push({ k: 'pay', label: '判对 × ' + L.correct, amount: L.pay });
  if (L.evN) out.push({ k: 'ev', label: '查实 × ' + L.evN, amount: L.evidence });
  if (L.double) out.push({ k: 'double', label: '工资翻倍（广告）', amount: L.double });
  L.warns.forEach((w, i) => out.push({ k: 'warn', label: '警告 ' + (i + 1) + ' · ' + w.reason, amount: 0 }));
  L.fines.forEach((f, i) => out.push({ k: 'fine', label: '罚单 · ' + f.reason, amount: -f.amount, appealed: f.appealed, idx: i }));
  L.events.forEach((e) => out.push({ k: 'event', label: e.title, amount: e.money }));
  if (L.drawer) out.push({ k: 'drawer', label: '抽屉里的钱（不记账）', amount: L.drawer });
  out.push({ k: 'total', label: '今天进账', amount: income(day) });
  return out;
}

// —— 家里 ——
function dealActive(run) {
  const F = run.flags;
  return !!(F.drug2_took && F.drug2_pass && !F.drug3_reject);
}
function costs(run, day) {
  const ci = chapter(run) - 1;
  const H = config.home;
  const med = H.med[ci];
  return {
    rent: H.rent[ci],
    heat: day && day.gifts.heat ? 0 : H.heat[ci],
    food: day && day.gifts.food ? 0 : H.food[ci] + (run.fam.dou && !run.fam.dou.dead ? H.foodExtra : 0),
    med,
    medNan: dealActive(run) ? Math.round(med * H.medDealRate) : med,
    tuition: H.tuitionStep,
  };
}

function word(m) {
  if (!m || m.dead) return '';
  const W = data.words;
  if (m.sick >= 2) return W.grave;
  if (m.sick === 1) return W.sick;
  if (m.hunger >= 1) return W.hungry;
  if (m.cold >= 1) return W.cold;
  return '';
}

function homeBeats(run) {
  const d = run.dayIdx + 1;
  return story.home.filter((h) => (h.day === d || (h.keep && h.day <= d)) && meets(run.flags, h.need));
}

// 今晚家里：谁在、各自一个字、桌上摆了什么
function homeTonight(run) {
  const d = run.dayIdx + 1;
  const dd = data.days[run.dayIdx];
  if (run.flags.dou_adopt && !run.fam.dou) run.fam.dou = mem();
  const beats = homeBeats(run);
  const tonight = beats.filter((h) => h.day === d);
  const late = tonight.find((h) => h.late && !run.fam[h.late].dead);
  const members = [];
  ['nan', 'man', 'yuan', 'dou'].forEach((id) => {
    const m = run.fam[id];
    if (!m) return;
    if (id === 'yuan' && !dd.weekend) return;
    members.push({ id, name: data.family[id].name, word: word(m), sick: m.sick, dead: m.dead, late: !!(late && late.late === id) });
  });
  return {
    members,
    items: beats.filter((h) => h.item).map((h) => h.item),
    caption: (tonight.find((h) => h.caption && (!h.late || late)) || {}).caption || '',
    late: late || null,
    yuan: tonight.find((h) => h.yuan) || null,
    weekend: !!dd.weekend,
  };
}

// 谁需要药
function needsMed(run) {
  return ['nan', 'man', 'dou'].filter((id) => run.fam[id] && !run.fam[id].dead && run.fam[id].sick > 0);
}

// buys: { heat, food, med: { nan, man, dou }, tuition, doctor: id|null }
// 先付房租（必付，不够就欠），再付选了的；过夜后每人的字会变
function sleep(run, day, buys) {
  const c = costs(run, day);
  const H = config.health;
  const d = day.idx + 1;
  const dd = data.days[day.idx];
  const report = { changes: [], income: [], spent: 0, debt: false, deaths: [] };
  run.money -= c.rent;
  report.spent += c.rent;
  if (buys.heat && c.heat) { run.money -= c.heat; report.spent += c.heat; }
  if (buys.food && c.food) { run.money -= c.food; report.spent += c.food; }
  ['nan', 'man', 'dou'].forEach((id) => {
    if (buys.med && buys.med[id]) {
      const p = id === 'nan' ? c.medNan : c.med;
      run.money -= p;
      report.spent += p;
    }
  });
  if (buys.tuition) {
    run.money -= c.tuition;
    run.tuition += c.tuition;
    report.spent += c.tuition;
  }
  if (buys.doctor) run.doctorUsed[dd.ch] = (run.doctorUsed[dd.ch] || 0) + 1;
  const fed = !!(buys.food || day.gifts.food);
  const warm = !!(buys.heat || day.gifts.heat);
  const badMed = run.flags.drug_bad && d === 11;
  const cough = (story.nanCough || []).indexOf(d) >= 0;
  ['nan', 'man', 'yuan', 'dou'].forEach((id) => {
    const m = run.fam[id];
    if (!m || m.dead) return;
    if (id === 'yuan' && !dd.weekend) return; // 阿圆平时住在内城东家
    const before = word(m);
    m.hunger = fed ? 0 : m.hunger + 1;
    m.cold = warm ? 0 : m.cold + 1;
    const gotMed = !!(buys.med && buys.med[id]) && !(badMed && id === 'nan');
    let cured = false;
    if (m.sick > 0) {
      if (gotMed) {
        m.sick -= 1;
        cured = true;
      } else m.sick += 1;
    }
    if (buys.doctor === id && m.sick > 1) m.sick = 1;
    let died = false;
    if (m.sick >= H.deathAt) {
      m.dead = true;
      m.deadDay = d;
      died = true;
      run.stats.deaths.push({ id, day: d });
      report.deaths.push(id);
    } else if (m.sick === 0 && !cured) {
      if (m.hunger >= H.hungerSick || m.cold >= H.coldSick || (id === 'nan' && m.cold >= H.nanColdSick) || (id === 'nan' && cough) || (id === 'nan' && badMed)) m.sick = 1;
    }
    if (badMed && id === 'nan' && !m.dead && m.sick === 0) m.sick = 1;
    report.changes.push({ id, before, after: word(m), died });
  });
  // 夜里的钱：小满晚归带回来的、周末阿圆带回来的
  const home = homeTonight(run);
  if (home.late) {
    const extra = home.late.money + (run.fam.man.hunger >= 1 ? story.hungryErrandBonus : 0);
    run.money += extra;
    run.errands += 1;
    run.flags.man_errand = true;
    report.income.push({ who: 'man', money: extra });
  }
  if (home.yuan && !run.fam.yuan.dead) {
    run.money += home.yuan.money;
    report.income.push({ who: 'yuan', money: home.yuan.money });
  }
  if (run.money < 0) {
    run.debt += 1;
    report.debt = true;
    if (run.debt >= config.home.debtLimit) run.over = { kind: 'evicted', day: d };
  } else run.debt = 0;
  const L = day.ledger;
  run.stats.days.push({ day: d, n: L.n, correct: L.correct, wrong: L.wrong, income: income(day), money: run.money, queue: day.queue.length, overtime: day.overtimeUsed, words: famWords(run) });
  return report;
}

function famWords(run) {
  const o = {};
  Object.keys(run.fam).forEach((id) => {
    const m = run.fam[id];
    if (m) o[id] = m.dead ? '空椅子' : word(m) || '好';
  });
  return o;
}

function nextDay(run) {
  run.dayIdx += 1;
  return run.dayIdx < DAYS && !run.over;
}

// 第几章刚结束（第 6、12 天过完）
function chapterJustEnded(run) {
  const d = run.dayIdx + 1;
  const ch = data.chapters.find((c) => c.days[1] === d);
  return ch ? ch.n : 0;
}

// —— 报纸 ——
function paper(run) {
  const d = run.dayIdx + 1;
  const F = run.flags;
  const cands = story.papers.filter((p) => p.day === d && meets(F, p.need));
  let best = null;
  cands.forEach((p) => {
    const pr = p.prio != null ? p.prio : p.need ? 1 : 0;
    if (!best || pr > best.pr) best = { pr, p };
  });
  const main = best ? best.p : { head: '外环晨报', pic: 'gate' };
  const deaths = run.stats.deaths.filter((x) => x.day === d - 1);
  let side = '';
  if (deaths.length) side = fill(story.obit, data.family[deaths[0].id].name);
  else {
    const s = story.paperSide.find((x) => x.day === d && meets(F, x.need));
    side = s ? s.line : '';
  }
  return { head: main.head, sub: main.sub || '', pic: main.pic, who: main.who, who2: main.who2, side, date: today(run), day: d };
}

// —— 章节卡 ——
function fates(run, ch) {
  const out = [];
  const seen = {};
  story.fates.forEach((f) => {
    if (f.ch !== ch || seen[f.who]) return;
    if (!meets(run.flags, f.need)) return;
    // 没见过这个人就不写
    const met = story.beats.some((b) => b.who === f.who && run.flags[b.id + '_seen']);
    if (!met) return;
    seen[f.who] = true;
    out.push(f);
  });
  return out;
}

// —— 存档：整局就是一个能 JSON 的对象 ——
function snapshot(run) {
  return JSON.parse(JSON.stringify(run));
}
function restore(obj) {
  if (!obj || obj.v !== 2 || typeof obj.dayIdx !== 'number') return null;
  return obj;
}

// —— 机器人用：只看证件上写的东西 + 今天的规则（不偷看答案）——
// 返回要拉的那根线 [a, b]；needPrint = 第 2 章照片不像，要按手印才知道
function checkByRules(run, p) {
  if (!p || !p.docs) return null;
  const d = p.docs;
  const t = today(run);
  const rs = rules(run);
  for (let i = 0; i < rs.length; i++) {

// ================= 工资条 =================
function enterSlip() {
  G.slip = { lines: D.payslip(G.run, G.day), shown: 0, t: 0, banked: 0, flown: false, done: false };
  U.setMode('slip');
  sfx.whoosh();
}
function slipLayout() {
  const lines = G.slip.lines;
  const top = 76;
  const bottom = L.H - 206;
  const lh = Math.max(17, Math.min(26, Math.floor((bottom - top - 30) / lines.length)));
  return { top, lh, x: 50, w: L.W - 100, walletY: Math.min(L.H - 180, top + 30 + lines.length * lh + 52) };
}
function updateSlip(dt) {
  const s = G.slip;
  s.t += dt;
  const n = Math.min(s.lines.length, Math.floor((s.t - 0.4) / AN.slipLineSec) + 1);
  while (s.shown < n) {
    const ln = s.lines[s.shown];
    s.shown += 1;
    sfx.printLine();
    if (ln.k === 'fine' && !ln.appealed) {
      sfx.fine();
      G.shake = config.juice.fineShake;
      G.flash = { t: 0, color: '224,67,58' };
      platform.vibrate(true);
    } else if (ln.k === 'warn') sfx.warn();
    else if (ln.k === 'drawer') sfx.rustle();
    else if (ln.k === 'event' && ln.amount < 0) sfx.bad();
    else if (ln.k === 'total') {
      sfx.register();
      platform.vibrate(true);
    }
    ln.at = G.t;
  }
  if (s.shown >= s.lines.length && !s.flown && s.t > 0.4 + s.lines.length * AN.slipLineSec + 0.2) {
    s.flown = true;
    flyTotal(D.income(G.day));
  }
  G.moneyTarget = G.run.money + s.banked;
}
function flyTotal(amount) {
  const s = G.slip;
  const lay = slipLayout();
  const ty = lay.top + 30 + (s.lines.length - 1) * lay.lh;
  if (amount === 0) {
    s.done = true;
    return;
  }
  const n = clamp(Math.round(Math.abs(amount) / 5), 3, 14);
  const per = amount / n;
  let got = 0;
  for (let i = 0; i < n; i++) {
    const big = Math.abs(amount) >= 20 && i % 3 === 0;
    U.flyMoney(amount > 0 ? L.W - 90 : L.W / 2, amount > 0 ? ty : lay.walletY, 1, {
      tx: amount > 0 ? L.W / 2 : L.W / 2 + 60, ty: amount > 0 ? lay.walletY : L.H + 20, kind: big ? 'bill' : 'coin', delay: i * 0.08, out: amount < 0,
      onArrive: () => {
        got += 1;
        s.banked = got >= n ? s.banked0 + amount : s.banked + per;
        if (got >= n) s.done = true;
      },
    });
  }
  s.banked0 = s.banked;
}
function slipAd(kind) {
  U.flow.ad(kind, () => {
    const before = D.income(G.day);
    if (kind === 'overtime') {
      D.addOvertime(G.run, G.day);
      W.openWindow();
      U.toast('加班', C.teal);
      return;
    }
    if (kind === 'double') D.applyDouble(G.day);
    if (kind === 'appeal') D.appealOne(G.day);
    const s = G.slip;
    s.lines = D.payslip(G.run, G.day);
    s.shown = s.lines.length;
    s.lines.forEach((l) => (l.at = G.t - 1));
    sfx.better();
    const gain = D.income(G.day) - before;
    if (gain) {
      s.done = false;
      flyTotal(gain);
    }
  });
}
function goHome() {
  if (!G.day.banked) {
    G.run.money += D.income(G.day);
    G.day.banked = true;
  }
  enterHome();
}

function stampMark(x, y, label, col, at, big) {
  const k = clamp((G.t - (at || 0)) / 0.12, 0, 1);
  const s = lerp(2.4, 1, easeOut(k));
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.18);
  ctx.scale(s, s);
  ctx.globalAlpha = 0.85 * k;
  ctx.strokeStyle = col;
  ctx.lineWidth = big ? 3 : 2;
  ctx.font = '900 ' + (big ? 14 : 11) + 'px sans-serif';
  const w = ctx.measureText(label).width + 12;
  ctx.strokeRect(-w / 2, -10, w, 20);
  A.text(ctx, label, 0, 0, big ? 14 : 11, col, 'center', '900');
  ctx.restore();
}

function drawSlip() {
  ctx.fillStyle = '#16111e';
  ctx.fillRect(0, 0, L.W, L.H);
  const s = G.slip;
  const lay = slipLayout();
  A.printer(ctx, L.W / 2 - 110, 22, 220, G.t, !s.done);
  A.text(ctx, '第 ' + (G.day.idx + 1) + ' 天 · 工资条', L.W / 2, 14, 11, C.grey, 'center', '800');
  const paperLen = 30 + s.shown * lay.lh + 10;
  const x = lay.x;
  const w = lay.w;
  const y = lay.top - 12;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - 8, 56, w + 16, paperLen + 30);
  ctx.clip();
  A.block(ctx, x, y, w, paperLen, '#f4efe2', '#e0d8c4', { shadeH: 4, drop: 4 });
  // 锯齿下边
  ctx.fillStyle = '#16111e';
  for (let i = 0; i < w; i += 8) {
    ctx.beginPath();
    ctx.moveTo(x + i, y + paperLen + 1);
    ctx.lineTo(x + i + 4, y + paperLen - 4);
    ctx.lineTo(x + i + 8, y + paperLen + 1);
    ctx.fill();
  }
  A.text(ctx, '内城关口 · 7 号窗 · ' + fmtDate(G.day.date), x + 10, y + 14, 10, '#8a7a6a', 'left', '800');
  for (let i = 0; i < s.shown; i++) {
    const ln = s.lines[i];
    const ly = lay.top + 30 + i * lay.lh - 6;
    const fs = lay.lh < 21 ? 11 : 12;
    let col = '#3a2a1a';
    if (ln.k === 'fine' || (ln.k === 'event' && ln.amount < 0)) col = C.redS;
    if (ln.k === 'drawer') col = '#9a929e';
    if (ln.k === 'total') {
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(x + 10, ly - lay.lh / 2 + 1, w - 20, 2);
      ctx.fillRect(x + 10, ly - lay.lh / 2 + 4, w - 20, 1);
    }
    if (ln.k === 'drawer') {
      ctx.save();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = '#b8b0bc';
      ctx.beginPath();
      ctx.moveTo(x + 10, ly - lay.lh / 2 + 2);
      ctx.lineTo(x + w - 10, ly - lay.lh / 2 + 2);
      ctx.stroke();
      ctx.restore();
    }
    A.text(ctx, ln.label, x + 12, ly, ln.k === 'total' ? 14 : fs, col, 'left', ln.k === 'total' ? '900' : '800');
    if (ln.amount != null && ln.k !== 'warn') {
      const amt = (ln.amount < 0 ? '−' : '+') + Math.abs(ln.amount);
      A.text(ctx, amt, x + w - 12, ly, ln.k === 'total' ? 17 : 14, ln.k === 'total' ? (ln.amount < 0 ? C.redS : '#2a7a3a') : col, 'right', '900');
    }
    if (ln.appealed) {
      ctx.fillStyle = C.redS;
      ctx.fillRect(x + 12, ly, w - 24, 2);
    }
  }
  ctx.restore();
  // 章：警告黄、罚单红（砸下来）、撤销青
  for (let i = 0; i < s.shown; i++) {
    const ln = s.lines[i];
    const ly = lay.top + 30 + i * lay.lh - 6;
    if (ln.k === 'warn') stampMark(x + w - 34, ly, '警告', '#c99a1e', ln.at, false);
    if (ln.k === 'fine') {
      if (ln.appealed) stampMark(x + w - 60, ly, '已撤销', '#1f9e93', ln.at, false);
      else stampMark(x + w - 64, ly, '罚', '#d8362d', ln.at, true);
    }
    if (ln.k === 'drawer') stampMark(x + w - 70, ly, '不记账', '#8b8496', ln.at, false);
  }
  // 钱包
  const wy = lay.walletY;
  G.walletPos = { x: L.W / 2, y: wy };
  A.wallet(ctx, L.W / 2 - 46, wy, G.moneyShown, G.walletBump);
  A.text(ctx, '¥ ' + Math.round(G.moneyShown), L.W / 2 + 6, wy, 22, G.moneyShown < 0 ? C.red : C.yellow, 'left', '900');
  if (!s.done) {
    A.text(ctx, '点一下 · 快进', L.W / 2, L.H - 50, 11, C.grey, 'center', '700');
    return;
  }
  // 广告（只救急）：加班 / 翻倍 二选一，申诉撤一张罚单
  const day = G.day;
  const adY = L.H - 136;
  const btns = [];
  const oneLeft = !day.overtimeUsed && !day.doubleUsed;
  btns.push({ id: 'overtime', label: '加班', sub: '▶ +' + config.overtimeSec + ' 秒', on: oneLeft, fn: () => slipAd('overtime') });
  btns.push({ id: 'double', label: '工资翻倍', sub: '▶ 最多 +' + config.doubleCap, on: oneLeft && day.ledger.pay > 0, fn: () => slipAd('double') });
  const canAppeal = day.appealsLeft > 0 && day.ledger.fines.some((f) => !f.appealed);
  btns.push({ id: 'appeal', label: '罚单申诉', sub: '▶ 撤一张', on: canAppeal, fn: () => slipAd('appeal') });
  const bw = (L.W - 20 - 16) / 3;
  btns.forEach((b, i) => {
    U.button(b.id, 10 + i * (bw + 8), adY, bw, 48, b.label, C.teal, '#1f9e93', b.fn, { size: 14, sub: b.sub, disabled: !b.on });
  });
  if (oneLeft && adY - 12 > wy + 30) A.text(ctx, '加班和翻倍，一天只能选一个', L.W / 2, adY - 12, 10, C.grey, 'center', '700');
  U.button('home', 40, L.H - 74, L.W - 80, 58, '回 家', C.green, C.greenS, goHome, { color: C.white, size: 22 });
}

// ================= 回家 =================
function enterHome() {
  const tonight = D.homeTonight(G.run);
  const c = D.costs(G.run, G.day);
  const buys = { heat: false, food: false, med: {}, tuition: false, doctor: null };
  // 默认：付得起就先勾暖气、饭，再给病人买药（玩家自己取舍）
  let left = G.run.money - c.rent;
  if (left >= c.heat) { buys.heat = true; left -= c.heat; }
  if (left >= c.food) { buys.food = true; left -= c.food; }
  D.needsMed(G.run).forEach((id) => {
    const p = id === 'nan' ? c.medNan : c.med;
    if (left >= p) { buys.med[id] = true; left -= p; }
  });
  G.home = { tonight, buys, costs: c, phase: 'choose', report: null, nt: 0, flyFx: {} };
  U.setMode('home');
  sfx.door();
}
function spent() {
  const h = G.home;
  const c = h.costs;
  let s = c.rent;
  if (h.buys.heat) s += c.heat;
  if (h.buys.food) s += c.food;
  Object.keys(h.buys.med).forEach((id) => { if (h.buys.med[id]) s += id === 'nan' ? c.medNan : c.med; });
  if (h.buys.tuition) s += c.tuition;
  return s;
}
function toggle(key, id) {
  const h = G.home;
  const c = h.costs;
  const b = h.buys;
  const price = key === 'med' ? (id === 'nan' ? c.medNan : c.med) : c[key];
  const on = key === 'med' ? !!b.med[id] : !!b[key];
  if (on) {
    if (key === 'med') b.med[id] = false;
    else b[key] = false;
    sfx.unmark();
    return;
  }
  if (G.run.money - spent() < price) {
    sfx.nope();
    U.toast('钱不够', C.red, G.homeLay.togY - 14);
    G.shake = 3;
    return;
  }
  if (key === 'med') b.med[id] = true;
  else b[key] = true;
  sfx.coin();
  if (key === 'heat') sfx.lamp();
  h.flyFx[key + (id || '')] = G.t;
  const tgt = G.homeLay.targets[key === 'med' ? 'med_' + id : key];
  if (tgt) U.flyMoney(G.homeLay.walletX, G.homeLay.walletY, 3, { tx: tgt[0], ty: tgt[1], out: true, gap: 0.05 });
}
function callDoctor(id) {
  U.flow.ad('doctor', () => {
    G.home.buys.doctor = id;
    sfx.better();
    U.toast('夜诊医生来过了', C.teal, G.homeLay.togY - 14);
  });
}
function sleepNow() {
  const h = G.home;
  h.report = D.sleep(G.run, G.day, h.buys);
  h.phase = 'night';
  h.nt = 0;
  h.seen = {};
  sfx.lamp();
  sfx.lullaby();
}
function updateHome(dt) {
  const h = G.home;
  if (h.phase === 'choose') {
    G.moneyTarget = G.run.money - spent();
    return;
  }
  h.nt += dt;
  G.moneyTarget = G.run.money;
  const ch = h.report.changes;
  ch.forEach((c, i) => {
    const at = 1.0 + i * 0.75;
    if (h.nt >= at && !h.seen[c.id]) {
      h.seen[c.id] = true;
      if (c.died) sfx.candle();
      else if (c.after === data.words.sick || c.after === data.words.grave) sfx.cough();
      else if (c.after === data.words.hungry) sfx.growl();
      else if (c.after === data.words.cold) sfx.wind();
      else if (c.before && !c.after) sfx.better();
    }
  });
  const incAt = 1.0 + ch.length * 0.75;
  h.report.income.forEach((inc, i) => {
    const at = incAt + i * 0.9;
    const k = 'inc' + i;
    if (h.nt >= at && !h.seen[k]) {
      h.seen[k] = true;
      if (inc.who === 'man') sfx.door();
      const seat = G.homeLay.seats[inc.who];
      if (seat) {
        U.flyMoney(seat[0], seat[1] + 30, 4, { tx: G.homeLay.walletX, ty: G.homeLay.walletY, gap: 0.1, delay: 0.4 });
        U.float('+¥' + inc.money, seat[0], seat[1] - 10, C.yellow, 16);
      }
    }
  });
  h.doneAt = incAt + h.report.income.length * 0.9 + 0.6;
}

const WORD_COL = { 冷: '#7fb8ff', 饿: '#ffb04a', 病: '#ff7aa8', 重病: '#ff4a3a' };

// 小屋：灯、炉子、窗外的雪、桌上的碗和药、每人头上一个字
function drawHouse(x, y, w, h) {
  const hm = G.home;
  const night = hm.phase === 'night';
  const heat = hm.buys.heat || !!G.day.gifts.heat;
  const food = hm.buys.food || !!G.day.gifts.food;
  const t = G.t;
  const lay = { seats: {}, targets: {} };
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.fillStyle = heat ? '#4a3040' : '#2a3048';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = heat ? '#3e2836' : '#232840';
  for (let i = 0; i < 6; i++) ctx.fillRect(x + i * 64 + 20, y, 3, h);
  const floorY = y + h - 30;
  ctx.fillStyle = '#3a2a22';
  ctx.fillRect(x, floorY, w, 30);
  ctx.fillStyle = '#2a1e18';
  for (let i = 0; i < 8; i++) ctx.fillRect(x + i * 48, floorY + 10, 30, 2);
  // 窗：夜、月亮、雪
  const wx = x + 24;
  const wy = y + 18;
  A.block(ctx, wx, wy, 84, 62, '#141c34', null, { outline: 3 });
  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath();
  ctx.arc(wx + 62, wy + 18, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#d8e4f0';
  for (let i = 0; i < 14; i++) {
    const sx = (i * 23 + t * 8 * (1 + (i % 3))) % 84;
    const sy = (i * 17 + t * 22 * (1 + (i % 2))) % 62;
    ctx.fillRect(wx + sx, wy + sy, 2, 2);
  }
  if (!heat) {
    ctx.fillStyle = 'rgba(200,230,255,0.25)';
    ctx.fillRect(wx, wy + 48, 84, 14);
    ctx.fillRect(wx, wy, 10, 62);
  }
  ctx.fillStyle = C.ink;
  ctx.fillRect(wx + 40, wy, 3, 62);
  ctx.fillRect(wx, wy + 30, 84, 3);
  // 炉子
  const sx = x + 8;
  const sy = floorY - 76;
  A.block(ctx, sx, sy, 36, 76, '#3a3440', '#2a2430', { shadeH: 8 });
  A.block(ctx, sx + 6, sy + 40, 24, 22, heat ? '#2a1010' : '#141018', null, { outline: 2 });
  if (heat) {
    for (let i = 0; i < 3; i++) {
      const fh = 8 + Math.abs(Math.sin(t * 9 + i * 2)) * 10;
      ctx.fillStyle = i === 1 ? C.yellow : '#ff7a2a';
      ctx.fillRect(sx + 9 + i * 7, sy + 60 - fh, 5, fh);
    }
  } else {
    ctx.fillStyle = 'rgba(200,230,255,0.4)';
    ctx.fillRect(sx + 2, sy + 2, 32, 3);
  }
  ctx.fillStyle = '#2a2430';
  ctx.fillRect(sx + 14, y, 8, sy - y);
  lay.targets.heat = [sx + 18, sy + 50];
  // 架子：学费罐、阿圆的相框、外婆的旧证

  const shy = y + 54;

    ctx.fillStyle = C.yellow;
    ctx.fillRect(shx + 8, shy - 4 - lvl * 12, 16, lvl * 12);

  if (items.indexOf('oldpass') >= 0) {
    ctx.save();
    ctx.translate(shx + 88, shy - 9);
    ctx.rotate(0.12);
    A.icon(ctx, 'oldpass', 0, 0, 2);
    ctx.restore();
  }
  if (items.indexOf('yuanpass') >= 0) {
    A.icon(ctx, 'yuanpass', shx + 52, shy + 26, 2);
  }
  // 门（小满晚归从这里进来）
  const dx = x + w - 40;
  const dy = floorY - 96;

  const manIn = !late || (night && hm.nt >= 1.0 + hm.report.changes.length * 0.75);
  const doorOpen = late && night && Math.abs(hm.nt - (1.0 + hm.report.changes.length * 0.75)) < 0.8;
  A.block(ctx, dx, dy, 34, 96, doorOpen ? '#0a0810' : '#5a3a28', '#3a2418', { shadeH: 6 });

    ctx.fillStyle = C.yellow;
    ctx.fillRect(dx + 6, dy + 50, 4, 4);

  if (items.indexOf('shoes') >= 0) A.icon(ctx, 'shoes', dx - 6, floorY + 10, 2);
  // 灯
  const lampX = x + w / 2;
  ctx.fillStyle = C.ink;
  ctx.fillRect(lampX - 1, y, 2, 34);
  const on = !night || hm.nt < 0.4;
  const glowR = on ? (heat ? 120 : 60) : 0;
  if (glowR) {
    const flick = heat ? 1 : 0.8 + 0.2 * Math.sin(t * 17) * Math.sin(t * 5);
    for (let i = 4; i >= 1; i--) {
      ctx.fillStyle = 'rgba(255,220,140,' + (0.05 * flick).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(lampX, y + 42, (glowR * i) / 4, 0, Math.PI * 2);
      ctx.fill();
    }

  A.block(ctx, lampX - 16, y + 32, 32, 12, on ? (heat ? '#ffd23f' : '#a88a3a') : '#3a3440', null, { outline: 2 });

    const st = G.run.fam[m.id];
    const ch = night ? hm.report.changes.find((c) => c.id === m.id) : null;
    const revealed = ch && hm.seen && hm.seen[m.id];
    const dead = night ? st.dead && (revealed || !ch || !ch.died) : st.dead;
    const dying = ch && ch.died && revealed;
    const wordNow = night ? (ch ? (revealed ? ch.after : ch.before) : D.word(st)) : m.word;
    const absent = m.late && !manIn;
    // 椅背
    A.block(ctx, cx - 9 * cell, ptop + 2 * cell, 18 * cell, 20 * cell, '#6a4a32', '#4a3222', { shadeH: 6 });
    if (absent) {
      A.icon(ctx, 'schoolbag', cx, ptop + 34, 2.5);
    } else if (!dead || dying) {
      const fadeK = dying ? clamp((hm.nt - (1.0 + hm.report.changes.indexOf(ch) * 0.75)) / 1.2, 0, 1) : 0;
      if (!(dead && fadeK >= 1)) {
        const grave = (wordNow === data.words.grave);
        ctx.save();

  const out = ['pass.seal', 'id.photo', 'id.name', 'pass.name', 'pass.until', 'chip.expiry', 'face'];
  if (G.chipRects['chip.seal']) out.unshift('chip.seal');
  return out;
}
function anchorAt(x, y, exclude) {
  const list = anchors().filter((a) => a !== exclude);
  for (let i = 0; i < list.length; i++) {
    const r = fieldRect(list[i]);
    if (r && U.inRect([r[0] - 4, r[1] - 4, r[2] + 8, r[3] + 8], x, y)) return list[i];
  }
  // 差一点也吸上去
  let best = null;
  let bd = config.snapDist;
  list.forEach((a) => {
    const c = center(a);
    const d = Math.hypot(c[0] - x, c[1] - y);
    if (d < bd) {
      bd = d;
      best = a;
    }
  });
  return best;
}
function billRect() {
  const p = LY.docs.pass;
  return [p.x + 54, p.y + 106, 60, 32];
}
function helpRect() {
  return G.chipRects.help;
}

// —— 拉线 ——
function doLink(a, b) {
  const p = G.cur;
  const res = D.link(G.run, p, a, b);
  if (res.kind === 'none') return;
  const ca = center(a);
  const cb = center(b);
  const mx = (ca[0] + cb[0]) / 2;
  const my = (ca[1] + cb[1]) / 2;
  const key = [a, b].sort().join('|');
  G.lines = G.lines.filter((l) => [l.a, l.b].sort().join('|') !== key || l.kind === 'red');
  if (G.lines.some((l) => l.kind === 'red' && [l.a, l.b].sort().join('|') === key)) {
    sfx.nope();
    return;
  }
  G.lines.push({ a, b, kind: res.kind, t: G.t });
  if (res.kind === 'green') {
    sfx.green();
    U.float(data.lineText.green, mx, my, C.green, 15);
    U.splat(cb[0], cb[1], C.green, 6, 0.4);
    if (!G.react || G.react.type === 'shrug') G.react = { type: 'shrug', t: 0, line: pick(Math.random, data.generic.shrug) };
    G.tut = Object.assign(G.tut || {}, { green: true });
  } else if (res.kind === 'grey' || res.kind === 'off') {
    sfx.grey();
    U.float(data.lineText[res.kind], mx, my, '#b8b0c8', 12);
  } else if (res.kind === 'red') {
    sfx.red();
    platform.vibrate(true);
    G.shake = J.redShake;
    G.freeze = 0.06;
    G.flash = { t: 0, color: '224,67,58' };
    U.splat(ca[0], ca[1], C.red, 9, 0.6);
    U.splat(cb[0], cb[1], C.red, 9, 0.6);
    U.float('对不上！', mx, my, C.red, 19);
    G.tut = Object.assign(G.tut || {}, { red: true });
    if (res.react && res.react !== 'again') {
      G.react = { type: res.react, t: 0, line: res.line, memory: res.memory, from: res.from, to: res.to };
      if (res.react === 'confess') sfx.sigh();
      else if (res.react === 'lie') sfx.liar();
      else if (res.react === 'explain') sfx.hmm();
      else if (res.react === 'bribe') {
        sfx.rustle();
        G.bribe = 'pending';
        const r = billRect();
        if (!p.med) U.float('¥' + res.from + ' → ¥' + res.to, r[0] + 30, r[1] + 46, C.yellow, 16);
        else U.float('药 ×2', r[0] + 30, r[1] + 46, C.yellow, 16);
        U.splat(r[0] + 30, r[1] + 14, '#8fdc98', 10, 0.6);
      }
    }
  }
}

function doPrint() {
  if (!canAct() || !D.canPrint(G.run, G.cur)) return;
  const m = D.takePrint(G.run, G.cur);
  G.printFx = { t: 0, match: m, said: false };
  sfx.ink();
  platform.vibrate(false);
}

// —— 判 ——
function decide(dec) {
  if (!canAct()) return;
  if (G.bribe === 'pending') {
    G.bribe = 'refused';
    U.toast(G.cur.med ? '药推回去了' : '钱推回去了');
    sfx.push();
  }
  G.decision = dec;
  G.drag = null;
  U.setPh('stamp');
}

function stampPos() {
  const p = LY.docs.pass;
  return [p.x + 87, p.y + 70];
}

function slam() {
  G.slammed = true;
  const res = D.resolve(G.run, G.day, G.cur, G.decision, G.bribe === 'took');
  G.result = res;
  const [sx, sy] = stampPos();
  const ok = G.decision === 'pass';
  const big = G.cur.story && G.cur.story.id === 'grey1' && G.decision === 'reject' && G.bribe === 'refused';
  U.splat(sx, sy, ok ? '#2fae5c' : '#d8362d', res.evidence || big ? 26 : 14, res.evidence || big ? 1.4 : 1);
  platform.vibrate(true);
  if (res.correct) {
    const n = 3 + (res.evidence ? 2 : 0);
    U.flyMoney(sx, sy - 10, n, { gap: 0.07 });
    U.float('+' + config.pay.correct, sx, sy - 40, C.green, 24);
    if (big) {
      G.shake = J.bigShake;
      G.freeze = J.bigHitstopSec;
      G.flash = { t: 0, color: '255,210,63' };
      sfx.stamp(true);
      sfx.fanfare();
    } else if (res.evidence) {
      G.shake = J.evidenceShake;
      G.freeze = J.hitstopSec;
      G.flash = { t: 0, color: '255,255,255' };
      sfx.stamp(true);
      sfx.evidence();
      U.float((G.cur.flaw && G.cur.flaw.legit ? '核实' : '查实') + ' +' + config.pay.evidence, sx, sy - 68, C.yellow, 19);
    } else {
      G.shake = J.stampShake;
      sfx.stamp(false);
      sfx.good();
    }
  } else {
    G.shake = J.stampShake;
    sfx.stamp(false);
    sfx.bad();
    G.flash = { t: 0, color: '224,67,58' };
  }
  if (res.reward) {
    U.float(res.reward.say, L.W / 2, LY.booth.y + 40, '#b8b0c8', 13);
    U.flyMoney(L.W / 2, LY.booth.y + 60, 3, { kind: 'bill', delay: 0.3 });
  }
}

function afterStamp() {
  if (G.result && !G.result.correct) {
    U.setMode('cite');
    G.cite = { res: G.result, slammed: false, lines: 0 };
  } else {
    U.setPh('leave');
    sfx.paper();
  }
}

function closeCite() {
  U.setMode('work');
  U.setPh('leave');
  sfx.paper();
}

function takeBribe(yes) {
  G.modal = null;
  const r = billRect();
  if (yes) {
    G.bribe = 'took';
    if (G.cur.med) {
      sfx.coin();
      U.float('药收下了', r[0] + 10, r[1] - 10, C.yellow, 14);
    } else {
      sfx.coin();
      U.flyMoney(r[0] + 30, r[1] + 14, Math.min(6, Math.ceil(G.cur.bribe / 10)), { kind: 'bill', gap: 0.08 });
      U.float('+¥' + G.cur.bribe + ' 进抽屉', r[0] + 10, r[1] - 10, '#c8c0d0', 14);
    }
  } else {
    G.bribe = 'refused';
    sfx.push();
    U.toast(G.cur.med ? '药推回去了' : '钱推回去了');
  }
}

function chooseTalk(id) {
  if (G.ph !== 'talk' || G.talkChoice) return;
  const c = D.talkChoice(G.run, G.day, G.cur, id);
  G.talkChoice = c;
  if (c.gift) {
    sfx.coin();
    U.float(c.gift === 'heat' ? '今晚暖气不用买' : '今晚饭不用买', L.W / 2, LY.deskY + 40, C.yellow, 15);
  } else sfx.paper();
  U.setPh('leave');
}

function callFile() {
  if (!canAct()) return;
  if (G.hl) return U.toast('档案已经调过了');
  if (G.day.adsLeft <= 0) {
    sfx.nope();
    return U.toast('今天的档案调完了');
  }
  U.flow.ad('file', () => {
    G.day.adsLeft -= 1;
    U.setMode('folder');
    sfx.folder();
  });
}

// —— 输入（按钮由 main 先判）——
function touch(type, id, x, y) {
  if (type === 'down') {
    if (G.modal === 'rules') {
      G.modal = null;
      sfx.paper();
      touches[id] = { role: 'none' };
      return;
    }
    if (G.modal) {
      touches[id] = { role: 'none' };
      return;
    }
    if (G.mode !== 'work') {
      touches[id] = { role: 'none' };
      return;
    }
    if (U.inRect(helpRect(), x, y)) {
      G.modal = 'rules';
      sfx.paper();
      touches[id] = { role: 'none' };
      return;
    }
    if (G.ph === 'talk') {
      touches[id] = { role: 'talk' };
      return;
    }
    if (G.ph === 'check' && !printing()) {
      if (G.bribe === 'pending' && U.inRect(billRect(), x, y)) {
        touches[id] = { role: 'bill' };
        return;
      }
      const a = anchorAt(x, y);
      if (a && (a !== 'face' || y < LY.counterY)) {
        touches[id] = { role: 'line' };
        G.drag = { from: a, x, y, x0: x, y0: y, moved: false, over: null, lastX: x, lastY: y };
        return;
      }
    }
    if (y >= LY.booth.y && y < LY.counterY) {
      sfx.tap();
      if (G.cur && G.ph === 'check') G.poke = G.t;
    }
    touches[id] = { role: 'none' };
  } else if (type === 'move') {
    const t = touches[id];
    if (!t || t.role !== 'line' || !G.drag) return;
    const d = G.drag;
    d.x = x;
    d.y = y;
    if (!d.moved && Math.hypot(x - d.x0, y - d.y0) > config.tapSlop) d.moved = true;
    if (d.moved) {
      const over = anchorAt(x, y, d.from);
      if (over !== d.over && over) sfx.tap();
      d.over = over;
      if (Math.hypot(x - d.lastX, y - d.lastY) > 26) {
        sfx.pull();
        d.lastX = x;
        d.lastY = y;
      }
    }
  } else {
    const t = touches[id];
    delete touches[id];
    if (!t) return;
    if (t.role === 'line' && G.drag) {
      const d = G.drag;
      G.drag = null;
      if (G.mode !== 'work' || G.ph !== 'check') return;
      if (!d.moved) {
        G.tapHint = { fid: d.from, t: G.t };
        sfx.tap();
        U.toast('按住，拖到另一处对一对', C.teal, LY.gapTop + 14);
      } else if (d.over) doLink(d.from, d.over);
      else {
        G.lines.push({ a: d.from, bx: x, by: y, kind: 'cancel', t: G.t });
        sfx.grey();
      }
    } else if (t.role === 'bill') {
      if (U.inRect(billRect(), x, y) && G.bribe === 'pending' && canAct()) {
        G.modal = 'bribe';
        sfx.paper();
      }
    } else if (t.role === 'talk') {
      const s = G.cur && G.cur.story;
      if (s && G.ph === 'talk' && G.talkStep < s.lines.length - 1 && G.phT > 0.3) {
        G.talkStep += 1;
        U.setPh('talk');
        G.phT = 0.31;
        sfx.paper();
      }
    }
  }
}

// —— 更新 ——
function update(dt) {
  const day = G.day;
  if (G.react) G.react.t += dt;
  if (G.printFx) {
    const pf = G.printFx;
    pf.t += dt;
    if (!pf.said && pf.t >= AN.printSec * 0.75) {
      pf.said = true;
      const r = fieldRect('id.photo');
      if (pf.match) {
        sfx.match();
        U.float('手印对上：本人', L.W / 2, LY.deskY + 158, C.green, 18);
      } else {
        sfx.nomatch();
        G.shake = J.redShake;
        U.float('手印对不上：冒名！', L.W / 2, LY.deskY + 158, C.red, 18);
        U.splat(r[0] + 30, r[1] + 30, C.red, 10, 0.6);
      }
    }
  }
  G.lines = G.lines.filter((l) => l.kind === 'red' || G.t - l.t < (l.kind === 'green' ? 1.6 : 0.6));
  const gateUp = G.mode === 'work' && G.ph === 'leave' && (G.decision === 'pass' || (G.talkChoice && G.ph === 'leave'));
  G.gate = lerp(G.gate, gateUp ? 1 : 0, Math.min(1, dt * 8));
  const cm = story.cameo;
  if (day.idx + 1 === cm.day && day.qi >= cm.at && day.qi <= cm.at + 2) G.cameoT = (G.cameoT || 0) + dt;
  if (G.mode === 'work') {
    day.timeLeft -= dt;
    const sec = Math.ceil(day.timeLeft);
    if (sec !== G.lastTick && day.timeLeft > 0 && day.timeLeft <= config.lowTimeSec) sfx.tick(sec <= 5);
    G.lastTick = sec;
    if (G.ph === 'enter') {
      if (Math.floor(G.phT / 0.14) !== Math.floor((G.phT - dt) / 0.14)) sfx.step(Math.floor(G.phT / 0.14));
      if (G.phT >= AN.walkIn) {
        if (isTalk(G.cur)) U.setPh('talk');
        else U.setPh('docs');
        sfx.paper();
      }
    } else if (G.ph === 'docs' && G.phT >= AN.docsIn) U.setPh('check');
    else if (G.ph === 'stamp') {
      if (!G.slammed && G.phT >= AN.stampHit) slam();
      if (G.phT >= AN.stampSec) afterStamp();
    } else if (G.ph === 'leave') {
      const extra = G.cur && G.cur.story ? AN.leaveLineSec : 0;
      if (G.phT >= AN.leave + extra) nextPerson();
    }
    if (G.mode === 'work' && day.timeLeft <= 0 && (G.ph === 'enter' || G.ph === 'docs' || G.ph === 'check' || G.ph === 'talk') && !printing()) endShift(false);
  } else if (G.mode === 'cite') {
    const c = G.cite;
    const nl = Math.min(3, Math.floor(G.modeT / 0.16));
    if (nl > c.lines) {
      c.lines = nl;
      sfx.printLine();
    }
    if (!c.slammed && G.modeT >= 0.75) {
      c.slammed = true;
      platform.vibrate(true);
      if (c.res.fine) {
        sfx.fine();
        G.shake = J.fineShake;
        G.flash = { t: 0, color: '224,67,58' };
        U.flyMoney(G.walletPos.x, G.walletPos.y, 3, { tx: G.walletPos.x + 30, ty: -30, out: true, gap: 0.08 });
      } else {
        sfx.warn();
        G.shake = 4;
      }
    }
    if (G.modeT >= AN.citeSec) closeCite();
  } else if (G.mode === 'folder') {
    if (G.modeT >= AN.folderSec) {
      const f = G.cur.flaw;
      G.hl = { t: G.t, clean: !f, legit: !!(f && f.legit), fields: f ? hlFields(f.kind) : [] };
      U.setMode('work');
      sfx.mark();
    }
  } else if (G.mode === 'closing') {
    if (G.modeT >= 1.8) U.flow.afterShift();
  }
}

function hlFields(kind) {
  return { expiry: ['pass.until', 'chip.expiry'], name: ['id.name', 'pass.name'], photo: ['id.photo', 'face'], photoOld: ['id.photo', 'face'], seal: ['pass.seal', 'chip.seal'] }[kind] || [];
}

// —— 画 ——
function drawHUD() {
  const y = LY.hudY;
  if (!G.day) return;
  A.block(ctx, 10, y, 86, 32, '#2a2236', '#201a2b', { shadeH: 3 });
  A.text(ctx, '第 ' + (G.day.idx + 1) + ' 天', 18, y + 10, 13, C.yellow, 'left', '900');
  A.text(ctx, '第 ' + G.day.ch + ' 章 · ' + fmtDate(G.day.date), 18, y + 24, 9, C.white, 'left', '700');
  const total = G.day.overtimeUsed ? config.overtimeSec : config.daySec[G.day.idx];
  const k = clamp(G.day.timeLeft / total, 0, 1);
  const low = G.day.timeLeft <= config.lowTimeSec;
  const bx = 106;
  const bw = 140;
  A.block(ctx, bx, y + 7, bw, 18, '#1a1424', null);
  ctx.globalAlpha = low ? 0.6 + 0.4 * Math.sin(G.t * 12) : 1;
  ctx.fillStyle = low ? C.red : G.day.overtimeUsed ? C.teal : C.yellow;
  ctx.fillRect(bx, y + 7, bw * k, 18);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(bx, y + 20, bw * k, 5);
  ctx.globalAlpha = 1;
  const mins = Math.round((1 - k) * 9 * 60) + 8 * 60;
  const clock = G.day.overtimeUsed ? '加班 ' + Math.max(0, Math.ceil(G.day.timeLeft)) + ' 秒' : (Math.floor(mins / 60) < 10 ? '0' : '') + Math.floor(mins / 60) + ':' + ('0' + (mins % 60)).slice(-2);
  ctx.save();
  ctx.font = '900 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = C.ink;
  ctx.strokeText(clock, bx + bw / 2, y + 16);
  ctx.fillStyle = C.white;
  ctx.fillText(clock, bx + bw / 2, y + 16);
  ctx.restore();
  // 钱包
  G.walletPos = { x: 282, y: y + 18 };
  A.block(ctx, 256, y, 109, 32, '#2a2236', '#201a2b', { shadeH: 3 });
  ctx.save();
  ctx.translate(282, y + 17);
  ctx.scale(0.42, 0.42);
  A.wallet(ctx, 0, 0, G.moneyShown, G.walletBump);
  ctx.restore();
  A.text(ctx, '¥ ' + Math.round(G.moneyShown), 304, y + 11, 15, G.moneyShown < 0 ? C.red : C.yellow, 'left', '900');
  const dr = G.day.ledger.drawer;
  A.text(ctx, dr ? '抽屉 ¥' + dr : '存款+今天', 304, y + 25, 9, dr ? '#c8c0d0' : C.grey, 'left', '700');
}

function personX() {
  if (G.ph === 'enter') return lerp(40, 187, easeOut(clamp(G.phT / AN.walkIn, 0, 1)));
  if (G.ph === 'leave') {
    const k = clamp((G.phT - (G.cur.story ? AN.leaveLineSec * 0.6 : 0.1)) / AN.leave, 0, 1);
    const pass = G.decision === 'pass' || (G.talkChoice && !G.decision);
    return lerp(187, pass ? 430 : -80, k * k);
  }
  return 187;
}

function drawPerson(p, cx) {
  const seed = hash(p.name);
  const period = 2.4 + (seed % 100) / 40;
  let blink = (G.t + (seed % 7)) % period < 0.13;
  const R = G.react;
  const talking = (G.ph === 'docs' || G.ph === 'talk' || (G.ph === 'check' && G.phT < 0.9) || (G.ph === 'leave' && p.story && G.phT < 0.8) || (R && R.t < 0.9)) && Math.floor(G.t / 0.12) % 2 === 0;
  const walking = G.ph === 'enter' || G.ph === 'leave';
  const breath = Math.round(Math.sin(G.t * 2.2 + seed) * 1.5);
  let bob = walking ? -Math.abs(Math.sin(G.t * 14)) * 5 : 0;
  let dx = G.poke && G.t - G.poke < 0.3 ? Math.sin((G.t - G.poke) * 40) * 3 : 0;
  const o = { blink, talk: talking, headDy: breath };
  let sweat = false;
  if (R && !walking) {
    if (R.type === 'confess') {
      o.mood = 'sad';
      o.headDy = breath + Math.round(4 * Math.min(1, R.t * 5));
      o.blink = blink || R.t % 2.2 < 1.4;
      o.talk = false;
    } else if (R.type === 'lie') {
      const hot = R.t < 3 || (R.t % 3) < 1;
      if (hot) o.look = Math.floor(G.t * 4) % 2 ? -1 : 1;
      dx += Math.round(Math.sin(G.t * 47) * 1);
      sweat = true;
    } else if (R.type === 'bribe') {
      if (R.t < 3) o.mood = 'grin';
    } else if (R.type === 'explain') {
      if (R.t < 0.4) bob = -Math.sin(R.t * 8) * 3;
    } else if (R.type === 'shrug') {
      if (R.t < 0.4) bob = -Math.sin(R.t * 8) * 2;
    }
  }
  const px = cx - (face.W * LY.cell) / 2 + dx;
  const py = LY.personTop + bob;
  A.portrait(ctx, p.face, px, py, LY.cell, o);
  if (sweat) {
    for (let i = 0; i < 3; i++) {
      const k = ((G.t * 0.9 + i * 0.37) % 1);
      const sx = px + (i === 1 ? 3 : i === 0 ? 14 : 15.5) * LY.cell;
      const sy = py + (5 + k * 6) * LY.cell;
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = C.ink;
      ctx.fillRect(sx - 1, sy - 1, LY.cell * 0.6 + 2, LY.cell + 2);
      ctx.fillStyle = '#9fd3ff';
      ctx.fillRect(sx, sy, LY.cell * 0.6, LY.cell);
      ctx.globalAlpha = 1;
    }
  }
  return { sweat };
}

function drawQueue() {
  const b = LY.booth;
  ctx.save();
  ctx.beginPath();
  ctx.rect(b.x, b.y, b.w, b.h);
  ctx.clip();
  const q = G.day.queue;
  const start = G.day.qi + 1;
  const shift = G.ph === 'enter' ? 1 - easeOut(clamp(G.phT / AN.walkIn, 0, 1)) : 0;
  const qc = Math.max(2, Math.min(3, LY.cell - 3));
  const baseY = b.y + b.h * 0.72 - 22 * qc;
  for (let i = 3; i >= 0; i--) {
    const p = q[start + i];
    if (!p) continue;
    const seed = hash(p.name);
    const x = b.x + 34 - i * 26 + shift * 26 + Math.sin(G.t * 0.7 + seed) * 2;
    const y = baseY - (i % 2) * 2 + Math.round(Math.sin(G.t * 2 + seed) * 1);
    A.portrait(ctx, p.face, x, y, qc, { blink: (G.t + (seed % 5)) % 3 < 0.12, tint: 'rgba(16,8,30,' + (0.45 + i * 0.1) + ')' });
  }
  // 第 12 天：队伍里一个像小满的男孩，看了你一眼，走了
  const cm = story.cameo;
  if (G.day.idx + 1 === cm.day && G.day.qi >= cm.at && G.day.qi <= cm.at + 2) {
    if (G.cameoT == null) G.cameoT = 0;
    const k = G.cameoT;
    const walk = clamp((k - 2.6) / 1.4, 0, 1);
    const x = b.x + 60 - walk * 140;
    const f = Object.assign({}, G.run.faces.man || face.withParts(() => 0.5, data.family.man.face), { hair: 7 });
    A.portrait(ctx, f, x, baseY - 4 - (walk > 0 ? Math.abs(Math.sin(G.t * 12)) * 3 : 0), qc, { look: k > 1 && k < 2.6 ? 1 : 0, tint: 'rgba(16,8,30,0.25)' });
    if (k > 0.6) G.run.flags.man_cameo = true;
  }
  ctx.restore();
}

function drawBubble(s, style) {
  const lines = U.wrap(s, 8).slice(0, 3);
  ctx.font = '800 13px sans-serif';
  const w = Math.min(150, Math.max(...lines.map((l) => ctx.measureText(l).width)) + 18);
  const h = 14 + lines.length * 17;
  const x = 358 - w;
  const y = LY.booth.y + 14;
  const pop = G.ph === 'docs' || (G.react && G.react.t < 0.15) ? easeOut(clamp((G.react && G.react.t < 0.15 ? G.react.t : G.phT) / 0.15, 0, 1)) : 1;
  const wob = style === 'lie' ? Math.sin(G.t * 30) * 1 : 0;
  const fill = { lie: '#fff3b8', confess: '#dfe6f0', bribe: '#d6f5da', explain: C.white }[style] || C.white;
  ctx.save();
  ctx.translate(x + wob, y + h);
  ctx.scale(pop, pop);
  A.block(ctx, 0, -h, w, h, fill, '#d8d2c6', { shadeH: 3 });
  ctx.fillStyle = C.ink;
  ctx.fillRect(-10, -12, 12, 4);
  ctx.fillStyle = fill;
  ctx.fillRect(-6, -11, 8, 2);
  lines.forEach((l, i) => A.text(ctx, l, 8, -h + 14 + i * 17, 13, C.ink, 'left', '800'));
  ctx.restore();
}

function drawMemory(m) {
  const k = easeOut(clamp(G.react.t / 0.3, 0, 1));
  const lines = U.wrap('「' + m.text + '」', 12).slice(0, 2);
  const w = 196;
  const h = 22 + lines.length * 15;
  const x = LY.booth.x + 6 - (1 - k) * 220;

}

function drawBooth() {
  const b = LY.booth;
  A.booth(ctx, b.x, b.y, b.w, b.h, G.t, G.gate);
  // 宋小树留下的照片，钉在窗框上
  if (G.run && G.run.flags.tree_photo) {
    const px = b.x + 64;
    const py = b.y + 8;
    const glow = G.cur && G.cur.story && G.cur.story.who === 'qing' && G.ph === 'check';
    if (glow) {
      ctx.fillStyle = 'rgba(255,210,63,' + (0.3 + 0.3 * Math.sin(G.t * 6)).toFixed(2) + ')';
      ctx.fillRect(px - 4, py - 4, 38, 46);
    }
    A.block(ctx, px, py, 30, 38, '#f4f0e8', '#d8d2c6', { shadeH: 6, outline: 1 });
    ctx.fillStyle = '#9fb7c9';
    ctx.fillRect(px + 3, py + 3, 24, 26);
    A.portrait(ctx, personFace('qing'), px + 3, py + 3, 1.33, {});
    ctx.fillStyle = C.red;
    ctx.fillRect(px + 13, py - 3, 4, 4);
  }
  if (['work', 'cite', 'ad', 'folder', 'closing'].indexOf(G.mode) >= 0) {
    drawQueue();
    if (G.cur && G.mode !== 'closing') {
      ctx.save();
      ctx.beginPath();
      ctx.rect(b.x, b.y, b.w, b.h);
      ctx.clip();
      drawPerson(G.cur, personX());
      ctx.restore();
    }
  }
  // 柜台
  const cy = LY.counterY;
  A.block(ctx, b.x, cy, b.w, b.y + b.h - cy, C.woodL, C.wood, { shadeH: 8, hi: '#7a5a42' });
  const here = G.cur && G.mode !== 'closing' && G.ph !== 'enter' && !(G.ph === 'leave' && G.phT > 0.3);
  if (here) {
    const sk = face.SKIN[G.cur.face.skin];
    const shake = G.react && G.react.type === 'lie' ? G.t : 0;
    A.hands(ctx, personX(), cy - 4, sk, shake);
    A.icon(ctx, G.cur.item, b.x + 52, cy - 14 + Math.round(Math.sin(G.t * 3) * 0.6), 3);
  }
  // 窗框
  ctx.fillStyle = C.ink;
  ctx.fillRect(b.x - 4, b.y - 4, b.w + 8, 5);
  ctx.fillRect(b.x - 4, b.y - 4, 5, b.h + 8);
  ctx.fillRect(b.x + b.w - 1, b.y - 4, 5, b.h + 8);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.beginPath();
  ctx.moveTo(b.x + 180, b.y);
  ctx.lineTo(b.x + 220, b.y);
  ctx.lineTo(b.x + 150, cy);
  ctx.lineTo(b.x + 110, cy);
  ctx.fill();
  // 对话
  if (G.cur && G.mode !== 'closing') {
    let line = null;
    let style = null;
    const s = G.cur.story;
    if (G.ph === 'talk' && s) line = s.lines[G.talkStep];
    else if (G.ph === 'docs' || G.ph === 'check' || G.ph === 'stamp' || G.mode === 'cite' || G.mode === 'ad' || G.mode === 'folder') {
      line = G.cur.line;
      if (G.react && (G.react.type !== 'shrug' || G.react.t < 1.1)) {
        line = G.react.line;
        style = G.react.type;
      }
    } else if (G.ph === 'leave' && G.phT < AN.leaveLineSec + 0.2) {
      if (G.talkChoice) line = G.talkChoice.say;
      else if (s) line = G.decision === 'pass' ? s.onPass : s.onReject;
    }
    if (G.poke && G.t - G.poke < 0.8 && G.ph === 'check') line = '嗯？';
    if (line) drawBubble(line, style);
    if (G.react && G.react.memory && (G.ph === 'check' || G.ph === 'stamp')) drawMemory(G.react.memory);
  }
}

function docsVisible() {
  if (!G.cur || !G.day || !G.cur.docs) return null;
  if (G.mode === 'closing') return null;
  if (G.ph === 'enter') return null;
  if (G.ph === 'docs') {
    const k = easeOut(clamp(G.phT / AN.docsIn, 0, 1));
    return { dy: -100 * (1 - k), a: k };
  }
  if (G.ph === 'leave') {
    const k = clamp(G.phT / 0.3, 0, 1);
    return { dy: -120 * k, a: 1 - k };
  }
  return { dy: 0, a: 1 };
}

function dashRect(r, color, lw) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw || 2;
  ctx.setLineDash([5, 4]);
  ctx.lineDashOffset = -G.t * 20;
  ctx.strokeRect(r[0] - 2, r[1] - 2, r[2] + 4, r[3] + 4);
  ctx.restore();
}

function drawDocs() {
  const p = G.cur;
  if (p && isTalk(p) && G.ph !== 'enter') {
    // 说话类：桌上只摆他带来的东西
    const a = G.ph === 'leave' ? 1 - clamp(G.phT / 0.4, 0, 1) : 1;
    ctx.globalAlpha = a;
    A.block(ctx, L.W / 2 - 80, LY.deskY + 10, 160, 110, '#3a2a22', '#2a1e18', { shadeH: 6 });
    A.icon(ctx, p.item, L.W / 2, LY.deskY + 56, 6);
    A.text(ctx, p.displayName || p.name, L.W / 2, LY.deskY + 108, 12, C.white, 'center', '900');
    ctx.globalAlpha = 1;
    return;
  }
  const v = docsVisible();
  if (!v) return;
  ctx.save();
  ctx.globalAlpha = v.a;
  ctx.translate(0, v.dy);
  const pos = LY.docs;
  A.idCard(ctx, pos.id.x, pos.id.y, p.docs.id);
  A.passCard(ctx, pos.pass.x, pos.pass.y, p.docs.pass);
  // 手印结果贴在身份卡上
  if (p.ix.printed && (!G.printFx || G.printFx.t >= AN.printSec + 0.3)) {
    const ok = p.ix.printMatch;
    A.block(ctx, pos.id.x + 8, pos.id.y + 92, 54, 16, ok ? C.green : C.red, null, { outline: 1 });
    A.text(ctx, ok ? '✓ 本人' : '✗ 冒名', pos.id.x + 35, pos.id.y + 100, 10, ok ? C.ink : C.white, 'center', '900');
  }
  // 档案高亮
  if (G.hl) {
    const a = 0.55 + 0.45 * Math.sin(G.t * 8);
    G.hl.fields.forEach((fid) => {
      if (fid.indexOf('chip.') === 0 || fid === 'face') return;
      const r = fieldRect(fid);
      ctx.strokeStyle = 'rgba(255,210,63,' + a.toFixed(2) + ')';
      ctx.lineWidth = 4;
      ctx.strokeRect(r[0] - 3, r[1] - 3, r[2] + 6, r[3] + 6);
    });
  }
  // 罚单时：红框标出漏看的地方
  if (G.mode === 'cite' && p.flaw) {
    const a = 0.55 + 0.45 * Math.sin(G.t * 10);
    p.flaw.fields.slice(0, p.flaw.kind === 'name' ? 2 : 1).forEach((fid) => {
      const r = fieldRect(fid);
      ctx.fillStyle = 'rgba(224,67,58,' + (a * 0.25).toFixed(2) + ')';
      ctx.fillRect(r[0] - 3, r[1] - 3, r[2] + 6, r[3] + 6);
      ctx.strokeStyle = 'rgba(255,90,80,' + a.toFixed(2) + ')';
      ctx.lineWidth = 4;
      ctx.strokeRect(r[0] - 3, r[1] - 3, r[2] + 6, r[3] + 6);
    });
  }
  // 夹着的钱 / 药
  if (G.bribe === 'pending') {
    const r = billRect();
    if (p.med) {
      const n = p.bribeRaised ? 2 : 1;
      for (let i = 0; i < n; i++) A.icon(ctx, 'medbottle', r[0] + 22 + i * 18, r[1] + 14 + Math.sin(G.t * 3 + i) * 1.5, 3);
    } else {
      if (p.bribeRaised) A.bill(ctx, r[0] + 36, r[1] + 10, Math.round(p.bribe / 2), Math.sin(G.t * 3 + 1) * 0.05 + 0.25);
      A.bill(ctx, r[0] + 29, r[1] + 15, p.bribeRaised ? Math.round(p.bribe / 2) : p.bribe, Math.sin(G.t * 3) * 0.04);
    }
  }
  if (G.slammed) {
    const ps = LY.docs.pass;
    A.bigStamp(ctx, ps.x + 87, ps.y + 66, 104, 44, G.decision === 'pass', 0.72, G.decision === 'pass' ? -0.12 : 0.1);
  }
  ctx.restore();
  // 拉线时：能对的地方都描一圈虚线
  if (G.drag && G.drag.moved && G.ph === 'check') {
    anchors().forEach((a) => {
      if (a === G.drag.from) return;
      const r = fieldRect(a);
      if (!r) return;
      if (a === 'face') return;
      dashRect(r, a === G.drag.over ? C.yellow : 'rgba(255,255,255,0.35)', a === G.drag.over ? 3 : 2);
    });
    if (G.drag.over === 'face' || G.drag.from === 'face') {
      const c = center('face');
      ctx.save();
      ctx.strokeStyle = G.drag.over === 'face' ? C.yellow : 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      ctx.lineDashOffset = -G.t * 20;
      ctx.beginPath();
      ctx.ellipse(c[0], c[1], 9 * LY.cell, 10 * LY.cell, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
  if (G.tapHint && G.t - G.tapHint.t < 0.8) {
    const r = fieldRect(G.tapHint.fid);
    if (r) dashRect(r, C.teal, 3);
  }
}

function strokeLine(x1, y1, x2, y2, color, lw, wob) {
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = lw + 3;
  ctx.lineCap = 'round';
  const seg = (stroke) => {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    if (wob) {
      const n = 8;
      for (let i = 1; i < n; i++) {
        const k = i / n;
        const nx = -(y2 - y1);
        const ny = x2 - x1;
        const len = Math.hypot(nx, ny) || 1;
        const off = Math.sin(i * 2.7 + G.t * 60) * wob * (i % 2 ? 1 : -1);
        ctx.lineTo(lerp(x1, x2, k) + (nx / len) * off, lerp(y1, y2, k) + (ny / len) * off);
      }
    }
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = stroke;
    ctx.stroke();
  };
  seg(C.ink);
  ctx.lineWidth = lw;
  seg(color);
  ctx.lineCap = 'butt';
}

function dot(x, y, r, color) {
  ctx.fillStyle = C.ink;
  ctx.beginPath();
  ctx.arc(x, y, r + 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawLines() {
  if (!G.cur || G.mode === 'closing') return;
  const vis = docsVisible();
  if (G.ph === 'leave' || (vis && vis.a < 1)) return;
  G.lines.forEach((l) => {
    const ca = center(l.a);
    const age = G.t - l.t;
    if (l.kind === 'cancel') {
      const k = clamp(age / 0.35, 0, 1);
      const x2 = lerp(l.bx, ca[0], k);
      const y2 = lerp(l.by, ca[1], k);
      ctx.globalAlpha = 1 - k;
      strokeLine(ca[0], ca[1], x2, y2, '#b8b0c8', 2);
      ctx.globalAlpha = 1;
      return;
    }
    const cb = center(l.b);
    if (l.kind === 'red') {
      const wob = age < 0.25 ? (0.25 - age) * 30 : 0;
      const pulse = 4 + Math.sin(G.t * 6) * 0.8;
      strokeLine(ca[0], ca[1], cb[0], cb[1], '#ff4a3a', pulse, wob);
      dot(ca[0], ca[1], 5, '#ff4a3a');
      dot(cb[0], cb[1], 5, '#ff4a3a');
    } else if (l.kind === 'green') {
      ctx.globalAlpha = clamp(1.6 - age, 0, 1);
      strokeLine(ca[0], ca[1], cb[0], cb[1], C.green, 3);
      dot(ca[0], ca[1], 4, C.green);
      dot(cb[0], cb[1], 4, C.green);
      ctx.globalAlpha = 1;
    } else {
      const k = clamp(age / 0.6, 0, 1);
      ctx.globalAlpha = 1 - k;
      ctx.save();
      ctx.setLineDash([4, 4]);
      strokeLine(ca[0], ca[1], lerp(cb[0], ca[0], k), lerp(cb[1], ca[1], k), '#b8b0c8', 2);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  });
  // 正在拉的线
  if (G.drag && G.drag.moved) {
    const ca = center(G.drag.from);
    const tgt = G.drag.over ? center(G.drag.over) : [G.drag.x, G.drag.y];
    ctx.save();
    if (!G.drag.over) {
      ctx.setLineDash([7, 5]);
      ctx.lineDashOffset = -G.t * 40;
    }
    strokeLine(ca[0], ca[1], tgt[0], tgt[1], G.drag.over ? C.yellow : C.white, 3);
    ctx.restore();
    dot(ca[0], ca[1], 5, C.yellow);
    dot(tgt[0], tgt[1], G.drag.over ? 7 : 5, G.drag.over ? C.yellow : C.white);
  }
}

function drawStampAnim() {
  if (G.ph !== 'stamp' || G.mode !== 'work') return;
  const [x, y] = stampPos();
  const ok = G.decision === 'pass';
  ctx.save();
  if (G.phT < AN.stampHit) {
    const k = G.phT / AN.stampHit;
    const s = lerp(2.4, 1, k * k);
    ctx.translate(x, y - (1 - k) * 60);
    ctx.scale(s, s);
  } else {
    const k = clamp((G.phT - AN.stampHit) / (AN.stampSec - AN.stampHit), 0, 1);
    ctx.globalAlpha = 1 - k;
    ctx.translate(x, y - 20 - k * 70);
  }
  A.block(ctx, -14, -46, 28, 30, '#7a4a2a', '#57331c', { shadeH: 5 });
  A.block(ctx, -30, -18, 60, 18, ok ? '#2fae5c' : '#d8362d', ok ? '#1f7a40' : '#962520', { shadeH: 5 });
  ctx.restore();
}

// 按手印：印泥 → 拇指按下 → 两个手印并排比
function drawPrintFx() {
  const pf = G.printFx;
  if (!pf || pf.t > AN.printSec + 0.4) return;
  const p = G.cur;
  const k = clamp(pf.t / AN.printSec, 0, 1);
  const fade = pf.t > AN.printSec ? 1 - (pf.t - AN.printSec) / 0.4 : 1;
  ctx.globalAlpha = fade;
  const w = 300;
  const h = 128;
  const x = (L.W - w) / 2;
  const y = LY.deskY + 2;
  A.block(ctx, x, y, w, h, '#efe5cc', '#cfc09c', { drop: 5, shadeH: 5 });
  A.text(ctx, '按手印', x + 10, y + 13, 12, '#8a6a4a', 'left', '900');
  A.text(ctx, '证上存的', x + 70, y + 28, 10, '#8a6a4a', 'center', '800');
  A.text(ctx, '他现在按的', x + w - 70, y + 28, 10, '#8a6a4a', 'center', '800');
  ctx.fillStyle = '#f7f1e2';
  ctx.fillRect(x + 40, y + 38, 60, 72);
  ctx.fillRect(x + w - 100, y + 38, 60, 72);
  A.fingerprint(ctx, x + 70, y + 74, 30, p.docs.id.print, 1);
  // 拇指落下
  const press = clamp((k - 0.15) / 0.3, 0, 1);
  if (k > 0.45) A.fingerprint(ctx, x + w - 70, y + 74, 30, p.print, 1, clamp((k - 0.45) / 0.3, 0, 1));
  if (k < 0.6) {
    const ty = lerp(y - 40, y + 50, easeOut(press)) - (k > 0.45 ? (k - 0.45) * 300 : 0);
    const sk = face.SKIN[p.face.skin];
    A.block(ctx, x + w - 86, ty, 32, 42, sk[0], sk[1], { shadeH: 8 });
    ctx.fillStyle = sk[1];
    ctx.fillRect(x + w - 80, ty + 6, 20, 3);
  }

// 小工具：可复现的随机数、数学、日期。

// 同一个 seed 永远出同一串随机数
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const randInt = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));

function shuffle(r, arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = arr[i];
    arr[i] = arr[j];
    arr[j] = t;
  }
  return arr;
}

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// 新历：每月 30 天。61 → '3.02'
function fmtDate(n) {
  const m = Math.floor(n / 30) + 1;
  const d = (n % 30) + 1;
  return m + '.' + (d < 10 ? '0' : '') + d;
}

// need: ['a', '!b']
function meets(flags, need) {
  if (!need) return true;
  return need.every((k) => (k[0] === '!' ? !flags[k.slice(1)] : !!flags[k]));
}

function fill(tpl, a, b) {
  return tpl.replace('{a}', a == null ? '' : a).replace('{b}', b == null ? '' : b);
}

module.exports = { rng, clamp, lerp, easeOut, easeIn, pick, randInt, shuffle, hash, fmtDate, meets, fill };
